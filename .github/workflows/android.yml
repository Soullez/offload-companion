name: Android Build & QA

on:
  push:
    paths-ignore:
      - "artifacts/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify supplied assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/font app/src/main/assets/brand

          cat ci_payload/poppins_light.part*.bin > app/src/main/res/font/poppins_light.ttf
          cat ci_payload/colour_profile.part*.bin > app/src/main/assets/brand/colour_profile.pdf

          echo "7f15d9a49bc6ca8b49ac995bbc36065b4bab0ed9f6d394a4c49d8f9ac85672c2  app/src/main/res/font/poppins_light.ttf" | sha256sum -c -
          echo "736dddb2978330451010278b2a88eba43497c3cd1af7ad010da4bcae41f4680a  app/src/main/assets/brand/colour_profile.pdf" | sha256sum -c -
          echo "e044cd4698f7c4083e5b8b12536b85ca4b847650ca2e9fbeed505e67cac2079f  app/src/main/res/font/moderniz.otf" | sha256sum -c -
          echo "4ec0feb66c29ad18bc2490634ab7f8c109b6cb81a552c147c4ef65e10d3ea327  app/src/main/res/drawable-nodpi/offload_logo.png" | sha256sum -c -

          EXPECTED_HVD="b15f185f6743d2ba99a378cb613216592b1e668f17ed769c1f3fa6066ef9a23f"
          rm -rf /tmp/hvd && mkdir -p /tmp/hvd/candidates

          try_otf() {
            local url="$1"
            local name="$2"
            local out="/tmp/hvd/candidates/$name"
            if curl --fail --location --retry 2 --connect-timeout 20 "$url" --output "$out"; then
              echo "candidate $name: $(stat -c%s "$out") bytes $(sha256sum "$out" | awk '{print $1}')"
            else
              rm -f "$out"
            fi
          }

          try_zip() {
            local url="$1"
            local name="$2"
            local zip="/tmp/hvd/$name.zip"
            local dir="/tmp/hvd/$name"
            if curl --fail --location --retry 2 --connect-timeout 20 "$url" --output "$zip"; then
              mkdir -p "$dir"
              unzip -jo "$zip" "*.otf" -d "$dir" || true
              if [ -d "$dir" ]; then
                while IFS= read -r -d '' candidate; do
                  local base
                  base="$(basename "$candidate")"
                  cp "$candidate" "/tmp/hvd/candidates/${name}-${base}"
                  echo "candidate ${name}-${base}: $(stat -c%s "$candidate") bytes $(sha256sum "$candidate" | awk '{print $1}')"
                done < <(find "$dir" -type f -name "*.otf" -print0)
              fi
            fi
          }

          try_zip "https://www.fontsquirrel.com/fonts/download/HVD-Comic-Serif-Pro" "fontsquirrel"
          try_zip "https://dl.dafont.com/dl/?f=hvd_comic_serif" "dafont"
          try_zip "https://www.ffonts.net/HVD-Comic-Serif-Pro.font.zip" "ffonts"
          try_zip "https://www.1001fonts.com/download/hvd-comic-serif-pro.zip" "1001fonts"
          try_otf "https://static.wfonts.com/data/2015/03/22/hvd-comic-serif-pro/HVD_Comic_Serif_Pro.otf" "wfonts.otf"
          try_otf "https://st.1001fonts.net/download/font/hvd-comic-serif-pro.hvdcomicserifpro.otf" "1001fonts-direct.otf"

          MATCH=""
          while IFS= read -r -d '' candidate; do
            if [ "$(sha256sum "$candidate" | awk '{print $1}')" = "$EXPECTED_HVD" ]; then
              MATCH="$candidate"
              break
            fi
          done < <(find /tmp/hvd/candidates -type f -print0)

          if [ -z "$MATCH" ]; then
            echo "::error::No public upstream HVD Comic Serif Pro file matched the supplied SHA-256."
            exit 1
          fi

          cp "$MATCH" app/src/main/res/font/hvd_comic_serif_pro.otf
          echo "$EXPECTED_HVD  app/src/main/res/font/hvd_comic_serif_pro.otf" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Static acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.offload.companion"' app/build.gradle.kts
          grep -q 'versionName = "0.1.4"' app/build.gradle.kts
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml
          grep -q 'FLAG_KEEP_SCREEN_ON' app/src/main/java/com/offload/companion/MainActivity.kt
          grep -q 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' app/src/main/java/com/offload/companion/MainActivity.kt
          if grep -R -q 'android.permission.INTERNET' app/src/main; then
            echo "::error::Internet permission must not be present."
            exit 1
          fi

          SCREEN=app/src/main/java/com/offload/companion/ui/FoundationScreen.kt
          for text in             'THE RUGBY' 'RED COACH' 'BLUE COACH' '+ Try' '+ Conversion'             'SCORE' 'OFFLOAD TRACK' 'REST' 'TURN TRACK' 'START TURN'             'END TURN' 'HALF' 'H1' 'H2' 'PHASES OF PLAY' 'ACTIONS'             'DICE ROLLER' 'RULES'; do
            grep -q "$text" "$SCREEN"
          done
          for target in 'START' 'OT'; do
            grep -q "$target" "$SCREEN"
          done
          OFFLOAD_STATE=app/src/main/java/com/offload/companion/state/MatchState.kt
          for target in '"2+"' '"3+"' '"4+"' '"5+"' '"6+"'; do
            grep -Fq "$target" "$OFFLOAD_STATE"
          done
          grep -q 'ScoreboardLogic.addTry' "$SCREEN"
          grep -q 'ScoreboardLogic.addConversion' "$SCREEN"
          grep -q 'Score Correction Minus' "$SCREEN"
          grep -q 'Score Correction Plus' "$SCREEN"
          grep -q 'Score Correction Done' "$SCREEN"
          grep -q 'Score Correction Cancel' "$SCREEN"
          grep -q 'object ScoreboardLogic' app/src/main/java/com/offload/companion/state/ScoreboardLogic.kt
          grep -q 'OffloadLogic.increase' "$SCREEN"
          grep -q 'OffloadLogic.decrease' "$SCREEN"
          grep -q 'OffloadLogic.rest' "$SCREEN"
          grep -q 'Red Offload Plus' "$SCREEN"
          grep -q 'Blue Offload Plus' "$SCREEN"
          grep -q 'REST Offload Tracks' "$SCREEN"
          grep -q 'object OffloadLogic' app/src/main/java/com/offload/companion/state/OffloadLogic.kt

      - name: Unit score and Offload tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.offload.companion'" /tmp/badging.txt
          grep -q "versionName='0.1.4'" /tmp/badging.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulator install, launch, landscape and multi-size QA
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-qa.sh

      - name: Prepare deliverables
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk offload-companion-v0.1.4-debug.apk
          sha256sum offload-companion-v0.1.4-debug.apk > offload-companion-v0.1.4-debug.apk.sha256

      - name: Upload APK and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: offload-companion-v0.1.4
          path: |
            offload-companion-v0.1.4-debug.apk
            offload-companion-v0.1.4-debug.apk.sha256
            qa/*.png
          if-no-files-found: error

      - name: Publish verified APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp offload-companion-v0.1.4-debug.apk artifacts/
          cp offload-companion-v0.1.4-debug.apk.sha256 artifacts/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/offload-companion-v0.1.4-debug.apk artifacts/offload-companion-v0.1.4-debug.apk.sha256

          if git diff --cached --quiet; then
            echo "APK already current."
            exit 0
          fi

          git commit -m "ci: publish APK for v0.1.4 [skip ci]"
          git push
